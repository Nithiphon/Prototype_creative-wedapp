<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Me ที่จอดรถ</title>
  <!-- เชื่อมต่อไฟล์ CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCREEN 1: HOME / FIND ME -->
  <div class="screen active" id="s1">
    <h1>Find Me ที่จอดรถ 🅿️</h1>
    <p class="sub">หาที่จอดรถว่างในมหาวิทยาลัยแบบเรียลไทม์</p>
    <div class="loc-box">
      <div id="locStatus">กดปุ่มด้านล่างเพื่อค้นหาที่จอดที่ใกล้ตำแหน่งคุณที่สุด</div>
    </div>
    <div class="card" id="suggestCard" style="display:none">
      <label>ที่ว่างแนะนำ</label>
      <h2 id="suggestText" style="text-align:left"></h2>
      <button class="btn-primary" id="goToSuggested">เลือกที่จอดนี้</button>
    </div>
    <button class="btn-primary" id="btnLocate" style="margin-bottom:10px">📍 เปิดตำแหน่ง</button>
    <button class="btn-ghost" id="btnBrowse">ดูผังที่จอดทั้งหมด</button>
  </div>

  <!-- SCREEN 2: FLOOR GRID -->
  <div class="screen" id="s2">
    <div class="top"><button class="back" data-back="s1">←</button><h2 style="margin:0">เลือกที่จอดที่ใกล้ที่สุด</h2></div>
    <div class="lots">
      <div class="lot-tab active" data-lot="A1">ชั้น A1</div>
      <div class="lot-tab" data-lot="B1">ชั้น B1</div>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>ว่าง</span>
      <span><span class="dot" style="background:var(--red)"></span>เต็ม</span>
    </div>
    <div class="grid" id="spotGrid"></div>
    <div class="status" id="gridStatus"></div>
    <button class="btn-ghost" id="btnRefresh" style="margin-top:16px">🔄 รีเฟรช</button>
  </div>

  <!-- SCREEN 3: BOOKING FORM -->
  <div class="screen" id="s3">
    <div class="top"><button class="back" data-back="s2">←</button><h2 style="margin:0">เลือกพื้นที่จอด</h2></div>
    <div class="card">
      <div class="field"><label>ลานจอดที่จอง</label><input id="fLotSpot" readonly></div>
      <div class="field"><label>เวลาที่จอง</label>
        <select id="fTime">
          <option>08.00 - 10.00</option>
          <option>10.00 - 12.00</option>
          <option>12.00 - 14.00</option>
          <option>14.00 - 16.00</option>
          <option>16.00 - 18.00</option>
        </select>
      </div>
      <div class="field"><label>วันที่จอง</label><input type="date" id="fDate"></div>
    </div>
    <button class="btn-primary" id="btnBook">จองทันที</button>
    <div class="status" id="bookStatus"></div>
  </div>

  <!-- SCREEN 4: CONFIRMATION -->
  <div class="screen" id="s4">
    <h2>จองเสร็จแล้ว 🎉</h2>
    <div class="confirm-circle">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">รหัสการจอง</div>
      <div class="code" id="cCode">—</div>
    </div>
    <div class="card">
      <div class="row"><span>Confirm spot</span><span id="cSpot">—</span></div>
      <div class="row"><span>Date</span><span id="cDate">—</span></div>
      <div class="row"><span>Time</span><span id="cTime">—</span></div>
    </div>
    <p class="sub" style="text-align:center">Thank you!! 🙏</p>
    <button class="btn-ghost" id="btnHome">กลับหน้าแรก</button>
  </div>

  <!-- เชื่อมต่อไฟล์ JS -->
  <script src="script.js"></script>
</body>
</html>
